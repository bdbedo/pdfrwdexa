services:
  - type: web
    name: pdfrwdexa-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: LIBREOFFICE_PATH
        value: libreoffice
